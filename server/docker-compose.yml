services:
  mariadb:
    image: mariadb:11.4
    container_name: costalog-agent-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-costalog_agent}
      MARIADB_USER: ${DB_USER:-costalog_agent}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Defina DB_ROOT_PASSWORD no .env}
      TZ: UTC
    command: ["--character-set-server=utf8mb4","--collation-server=utf8mb4_unicode_ci","--default-time-zone=+00:00"]
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - costalog_mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD","healthcheck.sh","--connect","--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
volumes:
  costalog_mariadb:
