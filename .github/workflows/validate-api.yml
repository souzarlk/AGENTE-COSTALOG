name: AGENTE COSTALOG — CI
on:
  push:
    branches: [main, feature/portal-foundation]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: ci_root_password
          MARIADB_USER: ci
          MARIADB_PASSWORD: ci_password
          MARIADB_DATABASE: costalog_ci
        ports: ["3306:3306"]
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: ci
      DB_PASSWORD: ci_password
      DB_NAME: costalog_ci
      DEVICE_TOKEN_PEPPER: ci-only-device-token-pepper-32-bytes-min
      ADMIN_SESSION_PEPPER: ci-only-admin-session-pepper-32-bytes-min
      CENTRAL_ADMIN_AUTH_SECRET: ci-only-central-secret-32-bytes-minimum
      CENTRAL_TOKEN_ISSUER: costalog-central-notas-fiscais
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: server
        run: npm install
      - name: Audit dependencies
        working-directory: server
        run: npm audit --omit=dev --audit-level=high
      - name: Validate API syntax
        working-directory: server
        run: npm run check
      - name: Apply MariaDB schema
        working-directory: server
        run: npm run db:migrate
      - name: Run tests
        working-directory: server
        run: npm test
      - name: Validate portal
        run: node --check assets/js/app.js && node --check assets/js/config.js
